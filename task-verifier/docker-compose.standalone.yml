services:

  # ── Base de datos PostgreSQL ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: task_verifier_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Volumen nombrado: los datos persisten aunque borres el contenedor
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exponemos al host para poder conectarte con DBeaver/pgAdmin
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_verifier_backend
    restart: unless-stopped
    env_file:
      # Lee variables desde backend/.env
      - ./backend/.env
    volumes:
      # Hot-reload: tu código local se monta dentro del contenedor
      - ./backend:/app
      # Volumen separado para fotos subidas (persiste independiente del código)
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Espera a que PostgreSQL esté listo antes de arrancar
        condition: service_healthy

  # ── Frontend React ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_verifier_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      # Hot-reload del frontend también
      - ./frontend:/app
      # node_modules aislado: NUNCA montar el node_modules del host
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data: